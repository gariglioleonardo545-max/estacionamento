<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Carros - ESP32</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2f; color: #fff; text-align: center; padding: 20px; }
        .card { background: #2a2a40; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button { padding: 12px 25px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        .btn-on { background: #28a745; color: white; }
        .btn-off { background: #dc3545; color: white; }
        .btn-reset { background: #6c757d; color: white; font-size: 14px; margin-top: 10px; }
        .numero { font-size: 36px; font-weight: bold; color: #00d4ff; }
    </style>
</head>
<body>

    <h1>Painel do Estacionamento</h1>

    <div class="card">
        <h2>Controle do LED</h2>
        <p>Status atual: <strong id="statusLed">Carregando...</strong></p>
        <button class="btn-on" onclick="mudarLed(1)">LIGAR LED</button>
        <button class="btn-off" onclick="mudarLed(0)">DESLIGAR LED</button>
    </div>

    <div class="card">
        <h2>Movimentação de Carros</h2>
        <p>Entradas: <span class="numero" id="entradas">0</span></p>
        <p>Saídas: <span class="numero" id="saidas">0</span></p>
        <p>No Estacionamento: <span class="numero" id="vagas">0</span></p>
        <button class="btn-reset" onclick="zerarContagem()">Zerar Contagem</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set, onValue } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyAQyxNvaSAhXW_v2hRaI1Eyb-6HabCWWKQ",
            databaseURL: "https://firebaseio.com",
            projectId: "contador-de-carro"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.mudarLed = function(estado) {
            set(ref(db, 'estacionamento/led'), estado);
        };

        window.zerarContagem = function() {
            set(ref(db, 'estacionamento/entradas'), 0);
            set(ref(db, 'estacionamento/saidas'), 0);
        };

        onValue(ref(db, 'estacionamento/led'), (snapshot) => {
            const val = snapshot.val();
            document.getElementById('statusLed').innerText = val === 1 ? "LIGADO" : "DESLIGADO";
        });

        onValue(ref(db, 'estacionamento'), (snapshot) => {
            const dados = snapshot.val();
            if (dados) {
                const ent = dados.entradas || 0;
                const sai = dados.saidas || 0;
                document.getElementById('entradas').innerText = ent;
                document.getElementById('saidas').innerText = sai;
                document.getElementById('vagas').innerText = ent - sai;
            }
        });
    </script>
</body>
</html>
